# ===================================================================
# EXPENZO APPLICATION CONFIGURATION (SPRING BOOT 3.x)
# ===================================================================

server.port=8080

# Application Name
spring.application.name=expenzo

# MySQL Database Configuration (Allows environment variables with safe defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expenzo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# File Upload Settings for Receipts
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Custom Expenzo Configuration
expenzo.upload.dir=uploads/receipts
expenzo.jwt.secret=4c7d9e2a5f8b1c4e7a0d3f6b9c2e5a8d1f4b7e0a3c6d9f2b5e8a1c4d7e0b3f6a
expenzo.jwt.expiration-ms=86400000

# Secure Initial Admin Provisioning (Configurable via ADMIN_INIT_PASS)
expenzo.init.admin-email=admin@expenzo.com
expenzo.init.admin-password=${ADMIN_INIT_PASS:Admin@1234}
